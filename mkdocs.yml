site_name: 免费互联网资源聚合导航站
site_url: https://nav.zhihu.blog/
site_author: shutouyabo
site_description: >-
  wiki nav

# repo_name: 免费互联网资源聚合导航站
# repo_url: https://github.com/shutouyabo/nav.zhihu.blog/

copyright: Copyright &copy; 2026 <a href="https://nav.zhihu.blog/" target="_blank" rel="noopener noreferrer">免费互联网资源聚合导航站</a>



theme:
  name: material
  language: zh
  static_templates:
    - 404.html
  favicon: images/favicon.ico
  apple-touch-icon-precomposed: images/mobile_icon.png
  include_search_page: false
  search_index_only: true

  features:
    - header.autohide
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.annotate

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  font:
    text: Roboto Slab
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

  custom_dir: overrides

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - i18n:
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true

  - search:
      lang:
        - zh
  - encryptcontent:
      remember_password: true        # 开启记住密码 关闭false 开启true
      default_expire_delay: 1      # 过期时间，单位小时；0.002778=10秒钟
      session_storage: true
  - git-revision-date:
  - minify:
      minify_html: true
  - open-in-new-tab:

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://v6.51.la/land/L0ZDlWY6HhH0NxKi
  analytics:
    provider: google
    property: G-KJB4RXSKZG

nav:
  - 前言: "index.md"
  - 我的导航收藏: "my.md"
  - 网站/软件/工具: "wangzhanruanjian.md"
  - 资源: "ziyuan.md"
  - 学习/提升: "xuexitisheng.md"
  - 不要早死   36: "buyaozaosi.md"
  - hi收藏: "hi.md"
  - hi2收藏: "hi2.md"





